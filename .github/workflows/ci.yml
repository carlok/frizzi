name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --lib --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info

  e2e:
    needs: [web, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Cache Mailpit and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/frizzi
            ~/.cache/ms-playwright
          key: e2e-tools-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/setup-tools.mjs') }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/setup-tools.mjs
      - run: cargo build --bins
      - run: npm test
        env:
          SKIP_BUILD: '1'
          CARGO: cargo
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
