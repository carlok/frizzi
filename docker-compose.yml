services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: frizzi
      POSTGRES_PASSWORD: frizzi
      POSTGRES_DB: frizzi
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frizzi -d frizzi"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres_data:
